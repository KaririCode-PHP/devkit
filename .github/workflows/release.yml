name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-phar:
    name: Build kcode.phar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: phar, zlib
          ini-values: phar.readonly=0
          tools: composer:v2

      - name: Compile PHAR
        run: |
          php -d phar.readonly=0 bin/build-phar.php
          ls -lh build/kcode.phar

      - name: Verify PHAR
        run: |
          php build/kcode.phar --version
          php build/kcode.phar --help
          echo "✓ PHAR verification passed"

      - name: Self-test
        run: |
          php build/kcode.phar init
          php build/kcode.phar migrate --dry-run
          echo "✓ Self-test passed"

      # The release body is the tag's section of CHANGELOG.md, followed by
      # installation notes. A tag without a CHANGELOG section fails here.
      - name: Build release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          cat >> release-notes.md <<EOF

          ## Installation

          Global PHAR (recommended):

          \`\`\`bash
          wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/kcode.phar
          chmod +x kcode.phar
          sudo mv kcode.phar /usr/local/bin/kcode
          \`\`\`

          Global Composer package: \`composer global require kariricode/devkit\`

          ## Quick Start

          \`\`\`bash
          cd your-component
          kcode quality      # provisions .kcode/ on the first run
          kcode migrate      # legacy components: Docker files and QA require-dev entries
          kcode up           # shared PHP container (.kcode/docker/)
          \`\`\`
          EOF
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KaririCode Devkit ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/kcode.phar
          body_path: release-notes.md
